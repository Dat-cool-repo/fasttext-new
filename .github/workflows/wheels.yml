# Build wheels for fasttext-new and test them on every platform.
#
# * abi3 wheels (one per platform, CPython >= 3.9): Linux x86_64 / aarch64 (manylinux),
#   macOS x86_64 / arm64, Windows x86_64.
# * Free-threaded wheel (cp314t): maturin builds a version-specific (non-abi3) extension for it
#   automatically, since abi3 does not cover free-threaded CPython before 3.15's abi3t.
#   No cp313t wheel: PyO3 0.29 only supports the free-threaded build from CPython 3.14 on.
# * sdist.
#
# Nothing is published from here: the wheels are uploaded as workflow artifacts only.
name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds to run each fuzz target (default 60)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  # (per event, so a manual run with fuzz_seconds is not cancelled by a push)
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo test --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features python --lib -- -D warnings
        env:
          PYO3_PYTHON: python

  fuzz:
    # 60 s per target on every push / PR. Run the workflow by hand with `fuzz_seconds` for a
    # longer campaign (e.g. `gh workflow run wheels -f fuzz_seconds=1500`).
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: load_model, max_len: 65536 }
          - { target: predict, max_len: 8192 }
          - { target: train, max_len: 4096 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: build
        working-directory: fuzz
        # (the prebuilt cargo-fuzz is a musl binary; build for the glibc target)
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu ${{ matrix.target }}
      - name: seed corpus
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp regressions/${{ matrix.target }}/* corpus/${{ matrix.target }}/ 2>/dev/null || true
          case ${{ matrix.target }} in
            load_model) cp ../tests/data/models/tiny_* corpus/load_model/ ;;
            predict) printf '\x00\x00apple banana cherry' > corpus/predict/seed ;;
            train) head -n 40 ../tests/data/models/train_tiny.txt | sed '1s/^/\x00\x00\x00/' > corpus/train/seed ;;
          esac
      - name: fuzz
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            corpus/${{ matrix.target }} -- -jobs=2 -workers=2 -print_final_stats=1 \
            -max_total_time=${{ github.event.inputs.fuzz_seconds || 60 }} \
            -rss_limit_mb=2048 -timeout=10 -max_len=${{ matrix.max_len }} || true
          tail -n 12 fuzz-*.log
          if ls artifacts/${{ matrix.target }}/* > /dev/null 2>&1; then
            echo "::error::fuzzing found crashes"; ls -la artifacts/${{ matrix.target }}; exit 1
          fi
      - name: crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/fuzz-*.log

  linux:
    name: linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist
      - name: free-threaded wheel (3.14t)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14t
            3.12
      - name: abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.12
      - name: free-threaded wheel (3.14t)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14t
            3.12
          architecture: x64
      - name: abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -i python3.12
      - name: free-threaded wheel (3.14t)
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
        python: ["3.10", "3.12", "3.14t"]
        include:
          # oldest supported Python (abi3-py39) with NumPy 1
          - { os: ubuntu-latest, python: "3.9", numpy: "numpy<2" }
          - { os: macos-14, python: "3.9", numpy: "numpy<2" }
          - { os: windows-latest, python: "3.9", numpy: "numpy<2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: install the wheel for this platform
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --find-links dist --no-index fasttext-new --no-deps
          python -m pip install "${{ matrix.numpy || 'numpy' }}" pytest
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import fasttext_new, sys; print(fasttext_new.__version__, getattr(sys, '_is_gil_enabled', lambda: True)())"
      - name: download lid.176.ftz (0.9 MB)
        shell: bash
        run: curl -fsSL --retry 3 -o data/lid.176.ftz --create-dirs https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
      - name: C++ reference (where it installs)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip install fasttext-numpy2
      - name: pytest
        shell: bash
        env:
          FASTTEXT_NEW_DATA: data
        # test_golden: parity with recorded C++ outputs (checked in: lid.176.ftz and the tiny
        # models of tests/data/models); test_selfcheck / test_malformed: self-consistency, API,
        # threading and corrupt-model tests (no C++ needed); test_parity runs fully only where
        # fasttext-numpy2 is installed (otherwise skipped).
        run: >-
          python -m pytest -q -p no:cacheprovider -rs
          tests/test_golden.py tests/test_selfcheck.py tests/test_malformed.py tests/test_parity.py
      - name: smoke test (train / test / quantize / save / reload, GIL released)
        shell: bash
        run: |
          python - <<'EOF'
          import os, tempfile, threading, fasttext_new as ft
          d = tempfile.mkdtemp()
          p = os.path.join(d, "train.txt")
          with open(p, "w", encoding="utf-8") as f:
              for i in range(3000):
                  lab, words = [("a", "apple apricot avocado"), ("b", "banana blueberry"), ("c", "cherry coconut")][i % 3]
                  f.write(f"__label__{lab} {words} filler{i % 17} common words\n")
          m = ft.train_supervised(input=p, epoch=5, lr=0.5, wordNgrams=2, bucket=10000, dim=16, verbose=0)
          n, p1, r1 = m.test(p)
          assert n == 3000 and p1 > 0.95, (n, p1)
          m.save_model(os.path.join(d, "m.bin"))
          assert ft.load_model(os.path.join(d, "m.bin")).predict("banana")[0] == ("__label__b",)
          m.quantize(input=p, retrain=True, cutoff=1000, verbose=0)
          m.save_model(os.path.join(d, "m.ftz"))
          q = ft.load_model(os.path.join(d, "m.ftz"))
          assert q.is_quantized() and q.predict("cherry coconut")[0] == ("__label__c",)
          print("smoke OK", p1)
          EOF
