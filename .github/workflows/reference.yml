# Checks against the C++ package that need downloads or take a while. Manual only:
#   gh workflow run reference
#
# * golden-tiny: regenerates tests/data/golden/tiny_*.json (C++ outputs of the committed tiny
#   models) and uploads them as an artifact.
# * full-suite: scripts/setup_env.sh + the whole pytest suite (parity, training quality,
#   quantization interop, golden files) on Linux with the C++ package.
# * real-data: language identification with lid.176.bin / lid.176.ftz on ~1 GB of FineWeb /
#   FineWeb-2 web text with both implementations (exact agreement, throughput, peak RSS), and a
#   17-language classifier trained on the same data with both.
#
# Nothing is published from here.
name: reference

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash  # -eo pipefail, so `| tee` does not hide failures

jobs:
  golden-tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install numpy pytest fasttext-numpy2 .
      - run: python scripts/make_golden.py --tiny
      - run: python -m pytest -q -p no:cacheprovider tests/test_golden.py -k tiny
      - uses: actions/upload-artifact@v4
        with:
          name: golden-tiny
          path: tests/data/golden/tiny_*.json

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FASTTEXT_NEW_DATA: ${{ github.workspace }}/../data
      FASTTEXT_NEW_VENV: ${{ github.workspace }}/../venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/setup_env.sh
      - run: bash scripts/test.sh -q -rs -s 2>&1 | tee pytest.log
      - run: grep -E "^(TRAIN|QUANT|PRETRAINED)|passed|failed" pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-log
          path: pytest.log

  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install numpy pyarrow huggingface_hub fasttext-numpy2 .
      - name: data
        run: |
          python bench/fetch_real_data.py ../real
          for f in lid.176.bin lid.176.ftz; do
            curl -fsSL --retry 3 -o ../$f https://dl.fbaipublicfiles.com/fasttext/supervised-models/$f
          done
          nproc; free -m; du -sh ../real
      - name: agreement and throughput
        run: |
          mkdir -p results
          for m in bin ftz; do
            for impl in rust cpp; do
              python bench/real_agreement.py run --impl $impl --model ../lid.176.$m \
                --out results/${impl}_$m.npz ../real/*.parquet | tee -a results/agreement.txt
            done
            python bench/real_agreement.py compare results/rust_$m.npz results/cpp_$m.npz ../real/*.parquet \
              | tee -a results/agreement.txt
          done
          python bench/real_agreement.py run --impl rust --threads 1 --model ../lid.176.bin \
            --out results/rust_bin_1t.npz ../real/*.parquet | tee -a results/agreement.txt
      - name: training on real data
        run: python bench/real_train.py --out-dir ../realtrain ../real/*.parquet | tee results/train.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-data-results
          path: results/*.txt
